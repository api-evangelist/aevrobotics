aid: aevrobotics
name: Applied EV
description: >-
  Applied EV (formerly AEV Robotics, legal entity Applied Electric Vehicles Ltd) is an Australian
  software-defined vehicle company founded in Melbourne in 2015 by Julian Broadbent and Shane Ambry.
  It builds the Blanc Robot, a cabinless autonomous-ready electric platform for logistics, industrial,
  mining and agricultural transport; the Digital Backbone, a safety-rated ASIL-D programmable vehicle
  control system; and an Internet-of-Vehicles (IoV) Cloud Platform the company markets as API-first.
  The IoV platform is advertised as a set of vehicle APIs — Access Manager for identity and access
  management, a Vehicle Task API, a Vehicle Mission API, a Drive API for autonomous driving and motion
  control, a Pod and Accessory API, and Virtual Vehicles for simulation — together with a Vehicle
  Management System for fleet telemetry, diagnostics, mapping, mission creation and over-the-air
  software updates. No public developer portal, API reference or machine-readable contract is served:
  the developer host resolves but refuses public connections, and the marketing pages route every
  developer path to an enquiry form.
